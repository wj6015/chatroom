version: '3.8'

services:
  chatroom:
    build: .
    container_name: chatroom
    restart: unless-stopped
    ports:
      - "10699:10699"
    environment:
      - PORT=10699
      - CHAT_PASSWORD=${CHAT_PASSWORD:-changeme}
      - GOGC=20
      - GOMEMLIMIT=64MiB
    # 严格资源限制（适合128MB小鸡）
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '0.8'
        reservations:
          memory: 32M
    # 使用tmpfs避免磁盘写入（可选）
    tmpfs:
      - /tmp:noexec,nosuid,size=10m
