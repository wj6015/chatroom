<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简聊天室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5;height:100vh;display:flex;flex-direction:column}
.header{background:#667eea;color:white;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.header h1{font-size:16px;font-weight:600}
.nick-area{display:flex;gap:8px;align-items:center}
.nick-area input{padding:6px 10px;border:none;border-radius:4px;width:100px;font-size:13px}
.nick-area button{padding:6px 12px;background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.4);border-radius:4px;cursor:pointer;font-size:12px}
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:180px;background:white;border-right:1px solid #ddd;padding:12px;overflow-y:auto;flex-shrink:0}
.sidebar h3{font-size:11px;color:#666;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px}
.user-list{list-style:none}
.user-list li{padding:8px;margin:4px 0;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;transition:all 0.2s}
.user-list li:hover{background:#f0f0f0}
.user-list li.active{background:#667eea;color:white}
.user-list li::before{content:"●";color:#2ecc71;font-size:8px}
.chat-area{flex:1;display:flex;flex-direction:column;background:white;min-width:0}
.messages{flex:1;overflow-y:auto;padding:15px}
.message{margin-bottom:12px;max-width:80%;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message.system{max-width:100%;text-align:center;color:#999;font-size:12px;margin:8px 0}
.message-header{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.nickname{font-weight:600;color:#667eea;font-size:13px}
.time{font-size:11px;color:#999}
.bubble{background:#f1f3f4;padding:8px 12px;border-radius:12px;display:inline-block;word-break:break-word;font-size:14px;line-height:1.4;color:#333}
.message.mine{margin-left:auto;text-align:right}
.message.mine .bubble{background:#667eea;color:white}
.message.mine .nickname{color:#764ba2}
.message.private .bubble{background:#fff3cd;border:1px solid #ffeaa7}
.input-area{border-top:1px solid #ddd;padding:12px 15px;background:#fafafa;flex-shrink:0}
.input-wrap{flex:1}
.target-info{font-size:11px;color:#666;margin-bottom:6px}
.target-info span{color:#667eea;cursor:pointer;text-decoration:underline}
.input-row{display:flex;gap:10px;align-items:center}
.input-area input{flex:1;padding:10px 15px;border:1px solid #ddd;border-radius:20px;font-size:14px;outline:none;transition:border 0.2s}
.input-area input:focus{border-color:#667eea}
.input-area button{padding:10px 20px;background:#667eea;color:white;border:none;border-radius:20px;cursor:pointer;font-size:14px;white-space:nowrap}
.input-area button:hover{background:#5568d3}
.empty-state{text-align:center;color:#999;padding:40px;font-size:14px}
@media(max-width:600px){.sidebar{display:none}.header h1{font-size:14px}}
</style>
</head>
<body>
<div class="header">
<h1>💬 极简聊天室</h1>
<div class="nick-area">
<input type="text" id="nickInput" placeholder="设置昵称" maxlength="20">
<button onclick="setNick()">设置</button>
</div>
</div>
<div class="main">
<div class="sidebar">
<h3>在线用户 (<span id="userCount">0</span>)</h3>
<ul class="user-list" id="userList"></ul>
</div>
<div class="chat-area">
<div class="messages" id="messages">
<div class="empty-state">欢迎来到聊天室！<br>设置昵称后开始聊天</div>
</div>
<div class="input-area">
<div class="input-wrap">
<div class="target-info" id="targetInfo">正在公共频道聊天 <span onclick="setPublic()">[切换]</span></div>
<div class="input-row">
<input type="text" id="msgInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">发送</button>
</div>
</div>
</div>
</div>
</div>

<script>
let ws,myNick="",targetUser="",reconnectTimer,pingTimer;

function connect(){
const proto=location.protocol==='https:'?'wss:':'ws:';
ws=new WebSocket(proto+'//'+location.host+'/ws');

ws.onopen=function(){
console.log('Connected');
if(myNick)setNick();
};

ws.onmessage=function(e){
const msg=JSON.parse(e.data);
handleMessage(msg);
};

ws.onclose=function(){
console.log('Disconnected');
clearTimeout(reconnectTimer);
reconnectTimer=setTimeout(connect,3000);
};

ws.onerror=function(e){
console.error('WS error:',e);
};
}

function handleMessage(msg){
if(msg.type==='online'){
updateUserList(msg.content);
return;
}

const div=document.createElement('div');
div.className='message';

if(msg.type==='system'){
div.className+=' system';
div.textContent=msg.content;
}else{
const isMine=msg.from===myNick;
const isPrivate=msg.type==='private';
if(isMine)div.className+=' mine';
if(isPrivate)div.className+=' private';
const prefix=isPrivate?(isMine?'→ '+msg.to:'← 私信'):'';
div.innerHTML='<div class="message-header"><span class="nickname">'+prefix+' '+(msg.from||'匿名')+'</span><span class="time">'+new Date(msg.timestamp*1000).toLocaleTimeString()+'</span></div><div class="bubble">'+escapeHtml(msg.content)+'</div>';
}

const container=document.getElementById('messages');
if(container.querySelector('.empty-state'))container.innerHTML='';
container.appendChild(div);
container.scrollTop=container.scrollHeight;
}

function updateUserList(usersStr){
const users=usersStr.split(',').filter(u=>u);
document.getElementById('userCount').textContent=users.length;
const list=document.getElementById('userList');
list.innerHTML='';
users.forEach(user=>{
const li=document.createElement('li');
li.textContent=user;
if(user===targetUser)li.className='active';
li.onclick=()=>setPrivate(user);
list.appendChild(li);
});
}

function setNick(){
const input=document.getElementById('nickInput');
const nick=input.value.trim();
if(!nick)return;
myNick=nick;
ws.send(JSON.stringify({type:'nick',content:nick}));
input.value='';
input.placeholder='当前: '+nick;
}

function send(){
const input=document.getElementById('msgInput');
const content=input.value.trim();
if(!content||!ws)return;
const msg={type:targetUser?'private':'public',content:content};
if(targetUser)msg.to=targetUser;
ws.send(JSON.stringify(msg));
input.value='';
}

function setPrivate(user){
targetUser=user;
document.getElementById('targetInfo').innerHTML='正在私信: <b>'+user+'</b> <span onclick="setPublic()">[取消]</span>';
}

function setPublic(){
targetUser='';
document.getElementById('targetInfo').innerHTML='正在公共频道聊天 <span onclick="setPublic()">[切换]</span>';
}

function escapeHtml(text){
const div=document.createElement('div');
div.textContent=text;
return div.innerHTML;
}

connect();
</script>
</body>
</html>
