<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>极简聊天室</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --sidebar-bg: #1a1d24;
  --header-bg: #1a1d24;
  --accent: #6c63ff;
  --text-light: #cdd1db;
  --border: #e4e6ea;
  --sidebar-w: 240px;
  --header-h: 52px;
}

html, body { 
  height: 100%; 
  width: 100%;
  overflow: hidden; 
  position: fixed; /* 防止移动端整体橡皮筋回弹 */
  font-family: -apple-system, sans-serif; 
}

/* ===== 核心布局方案 (解决需求2) ===== */
#app {
  display: flex;
  width: 100vw;
  height: 100vh; /* 后续由 JS 动态修正为 100dvh 或 visualViewport 高度 */
  background: #f0f2f5;
}

#sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.3s ease;
  z-index: 200;
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column; /* 垂直三段式 */
  overflow: hidden;
  position: relative;
  background: #fff;
}

/* 顶部：固定 */
#chat-header {
  height: var(--header-h);
  background: var(--header-bg);
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 16px;
  flex-shrink: 0; 
  z-index: 10;
}

/* 中间：自适应滚动 */
#messages-wrap {
  flex: 1; /* 关键：自动占据剩余空间 */
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* 底部：固定 */
#input-area {
  min-height: 60px;
  background: #fff;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  flex-shrink: 0; 
}

/* 其余样式保持你的 UI 风格 */
.msg-row { display: flex; gap: 8px; margin-bottom: 4px; }
.msg-row.me { flex-direction: row-reverse; }
.avatar { 
  width: 32px; height: 32px; border-radius: 50%; background: var(--accent); 
  color: #fff; display: flex; align-items: center; justify-content: center; 
  font-size: 12px; cursor: pointer; flex-shrink: 0;
}
.bubble { 
  max-width: 70%; padding: 8px 12px; border-radius: 12px; font-size: 14px; 
  line-height: 1.5; word-break: break-all;
}
.msg-row.me .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
.msg-row:not(.me) .bubble { background: #e9ebef; color: #1c1e21; border-bottom-left-radius: 2px; }

#msg-input {
  flex: 1; background: #f0f2f5; border: none; border-radius: 20px;
  padding: 8px 15px; outline: none; font-size: 15px; max-height: 120px;
}
#send-btn { background: var(--accent); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; margin-left: 8px; cursor: pointer; }

/* 移动端适配 */
@media (max-width: 680px) {
  #sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #menu-btn { display: block !important; margin-right: 10px; font-size: 20px; background: none; border: none; color: #fff; }
}

#overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 150; }
#overlay.show { display: block; }
</style>
</head>
<body>

<div id="nick-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;display:flex;align-items:center;justify-content:center;">
  <div style="background:#fff;padding:25px;border-radius:15px;width:85%;max-width:320px;">
    <h3>设置昵称</h3>
    <input id="nick-input" type="text" style="width:100%;padding:10px;margin:15px 0;border:1px solid #ddd;border-radius:8px;" placeholder="2-10位字符">
    <button id="nick-confirm" style="width:100%;padding:10px;background:#6c63ff;color:#fff;border:none;border-radius:8px;">进入</button>
    <p id="nick-err" style="color:red;font-size:12px;margin-top:5px;"></p>
  </div>
</div>

<div id="app">
  <div id="overlay"></div>
  <div id="sidebar">
    <div style="padding:20px; color:#fff; border-bottom:1px solid #333;">
      <b>在线列表</b><br><small id="my-nick-badge"></small>
    </div>
    <div id="public-entry" style="padding:15px; color:#fff; cursor:pointer;" class="active"># 公开频道</div>
    <div id="user-list" style="flex:1; overflow-y:auto;"></div>
  </div>

  <div id="main">
    <div id="chat-header">
      <button id="menu-btn" style="display:none;">☰</button>
      <div id="chat-title">公开频道</div>
    </div>
    <div id="messages-wrap"></div>
    <div id="input-area">
      <textarea id="msg-input" placeholder="输入消息..." rows="1"></textarea>
      <button id="send-btn">↑</button>
    </div>
  </div>
</div>

<script>
let myNick = '';
let currentChat = 'public';
let ws = null;
let onlineUsers = [];
const privateHistory = {};
const publicHistory = [];

const msgInput = document.getElementById('msg-input');
const messagesWrap = document.getElementById('messages-wrap');

// ===== 核心修复：键盘弹出高度自适应 (需求2) =====
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    // 动态设置 app 高度为视口高度，防止键盘顶起布局
    document.getElementById('app').style.height = window.visualViewport.height + 'px';
    scrollBottom();
  });
}

// ===== 核心修复：点击用户实现私聊 (需求3) =====
function clickUser(nick) {
  if (nick === myNick) return;
  currentChat = nick;
  document.getElementById('chat-title').textContent = '私聊: ' + nick;
  renderMessages();
  // 移动端点击后收起侧边栏
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({type:'nick', content: myNick}));
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if(msg.type === 'online') {
      onlineUsers = msg.content.split(',').filter(u => u && u !== myNick);
      updateUserList();
    } else if(msg.type === 'public') {
      publicHistory.push(msg);
      if(currentChat === 'public') appendMsgUI(msg);
    } else if(msg.type === 'private') {
      const peer = msg.from === myNick ? msg.to : msg.from;
      if(!privateHistory[peer]) privateHistory[peer] = [];
      privateHistory[peer].push(msg);
      if(currentChat === peer) appendMsgUI(msg);
    } else if(msg.type === 'system') {
        if(msg.content.includes("占用")) {
            alert(msg.content);
            location.reload();
        }
    }
  };
}

function updateUserList() {
  const list = document.getElementById('user-list');
  list.innerHTML = onlineUsers.map(u => `
    <div onclick="clickUser('${u}')" style="padding:12px 20px; color:#ccc; cursor:pointer; border-bottom:1px solid #222;">
      ● ${u}
    </div>
  `).join('');
}

function renderMessages() {
  messagesWrap.innerHTML = '';
  const list = currentChat === 'public' ? publicHistory : (privateHistory[currentChat] || []);
  list.forEach(appendMsgUI);
  scrollBottom();
}

function appendMsgUI(msg) {
  const isMe = msg.from === myNick;
  const div = document.createElement('div');
  div.className = `msg-row ${isMe ? 'me' : ''}`;
  // 头像增加点击私聊功能 (需求3)
  div.innerHTML = `
    <div class="avatar" onclick="clickUser('${msg.from}')">${msg.from[0].toUpperCase()}</div>
    <div class="bubble">${msg.content}</div>
  `;
  messagesWrap.appendChild(div);
  scrollBottom();
}

function scrollBottom() {
  messagesWrap.scrollTop = messagesWrap.scrollHeight;
}

// 事件监听
document.getElementById('nick-confirm').onclick = () => {
  const n = document.getElementById('nick-input').value.trim();
  if(n.length < 2) return;
  myNick = n;
  document.getElementById('my-nick-badge').textContent = '@' + myNick;
  document.getElementById('nick-modal').style.display = 'none';
  connectWs();
};

document.getElementById('send-btn').onclick = () => {
  const content = msgInput.value.trim();
  if(!content) return;
  const msg = {
    type: currentChat === 'public' ? 'public' : 'private',
    to: currentChat === 'public' ? '' : currentChat,
    content: content
  };
  ws.send(JSON.stringify(msg));
  msgInput.value = '';
  msgInput.style.height = 'auto';
};

document.getElementById('public-entry').onclick = () => {
  currentChat = 'public';
  document.getElementById('chat-title').textContent = '公开频道';
  renderMessages();
};

document.getElementById('menu-btn').onclick = () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
};

document.getElementById('overlay').onclick = () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
};
</script>
</body>
</html>
