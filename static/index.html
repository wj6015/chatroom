<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>宇宙公司聊天室</title>
<style>
/* 样式保持不变，仅优化逻辑 */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --sidebar-bg: #1a1d24;
  --header-bg: #1a1d24;
  --accent: #6c63ff;
  --text-light: #cdd1db;
  --border: #e4e6ea;
  --sidebar-w: 240px;
  --header-h: 52px;

  /* iOS 键盘修复核心变量 */
  --app-top: 0px;
  --app-height: 100svh;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, system-ui, sans-serif;
  background: #f0f2f5;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: auto;
}

body {
  position: fixed;
  inset: 0;
}

#app {
  position: fixed;
  left: 0;
  top: var(--app-top);
  width: 100vw;
  height: var(--app-height);
  background: #f0f2f5;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

#chat-header {
  height: var(--header-h);
  background: var(--header-bg);
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 16px;
  flex-shrink: 0;
}

#messages-wrap {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overscroll-behavior: contain;
}

#input-area {
  min-height: 60px;
  background: #fff;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  flex-shrink: 0;
}

#msg-input {
  flex: 1;
  background: #f0f2f5;
  border: none;
  border-radius: 20px;
  padding: 10px 15px;
  outline: none;
  font-size: 15px;
  max-height: 120px;
  resize: none;
  overflow-y: hidden;
  transition: height 0.2s ease; /* 添加平滑过渡效果 */
}

#send-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin-left: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
</style>
</head>
<body>

<div id="app">
  <div id="chat-header">公开频道</div>
  <div id="messages-wrap"></div>
  <div id="input-area">
    <textarea id="msg-input" placeholder="输入消息..." rows="1"></textarea>
    <button id="send-btn">发送</button>
  </div>
</div>

<script>
/* 优化后的 JavaScript */
const msgInput = document.getElementById('msg-input');
const messagesWrap = document.getElementById('messages-wrap');
const app = document.getElementById('app');

let layoutTimer = null;

/* 防抖函数：减少频繁调用 */
function debounce(func, delay) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => func.apply(this, args), delay);
  };
}

/* 同步视口布局 */
function syncViewportLayout() {
  const root = document.documentElement;
  const viewport = window.visualViewport || { offsetTop: 0, height: window.innerHeight };

  root.style.setProperty('--app-top', `${Math.round(viewport.offsetTop)}px`);
  root.style.setProperty('--app-height', `${Math.round(viewport.height)}px`);

  // 避免 iOS focus 后浏览器强行滚动 body
  window.scrollTo(0, 0);
}

/* 自动调整输入框高度 */
function autoResize() {
  msgInput.style.height = 'auto';
  msgInput.style.height = `${msgInput.scrollHeight}px`;
}

/* 滚动到底部 */
function scrollBottom() {
  messagesWrap.scrollTop = messagesWrap.scrollHeight;
}

/* 事件绑定 */
msgInput.addEventListener('input', () => {
  autoResize();
  debounce(scrollBottom, 100)();
});

msgInput.addEventListener('focus', () => {
  debounce(syncViewportLayout, 50)();
});

msgInput.addEventListener('blur', () => {
  debounce(syncViewportLayout, 50)();
});

/* 初始化布局 */
syncViewportLayout();

/* 监听窗口变化 */
window.addEventListener('resize', debounce(syncViewportLayout, 100));
window.addEventListener('orientationchange', debounce(syncViewportLayout, 300));

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', debounce(syncViewportLayout, 100));
  window.visualViewport.addEventListener('scroll', debounce(syncViewportLayout, 100));
}
</script>
</body>
</html>
