<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>宇宙公司聊天室</title>
<style>
/* ===== Reset & Layout ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root { --sidebar-bg: #1a1d24; --header-bg: #1a1d24; --accent: #6c63ff; --text-light: #cdd1db; --border: #e4e6ea; --sidebar-w: 240px; --header-h: 52px; }
html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; }

#app { display: flex; width: 100vw; height: 100vh; height: 100svh; background: #f0f2f5; overflow: hidden; }
#sidebar { width: var(--sidebar-w); background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; transition: 0.3s; z-index: 200; }
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; background: #fff; min-height: 0; }

#chat-header { height: var(--header-h); background: var(--header-bg); color: #fff; display: flex; align-items: center; padding: 0 16px; flex-shrink: 0; z-index: 10; }
#messages-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 15px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
#input-area { min-height: 60px; background: #fff; border-top: 1px solid var(--border); display: flex; align-items: center; padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); flex-shrink: 0; z-index: 100; }

.msg-row { display: flex; gap: 8px; margin-bottom: 4px; animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; } }
.msg-row.me { flex-direction: row-reverse; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; cursor: pointer; }
.bubble { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-all; }
.msg-row.me .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
.msg-row:not(.me) .bubble { background: #e9ebef; color: #1c1e21; border-bottom-left-radius: 2px; }

#msg-input { flex: 1; background: #f0f2f5; border: none; border-radius: 20px; padding: 10px 15px; outline: none; font-size: 15px; max-height: 120px; resize: none; }
#send-btn { background: var(--accent); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; margin-left: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.user-item { padding:12px 20px; color:#cdd1db; cursor:pointer; border-bottom:1px solid #2d323e; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.user-item:hover { background: rgba(255,255,255,0.05); }
.user-item.active { background: var(--accent); color: #fff; }
.dot { font-size: 10px; }
.dot.online { color: #48cfad; }
.dot.offline { color: #666; }

@media (max-width: 680px) {
  #sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #menu-btn { display: block !important; margin-right: 10px; font-size: 20px; background: none; border: none; color: #fff; }
}
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 150; }
#overlay.show { display: block; }

#nick-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; }
.modal-box { background: #fff; padding: 28px; border-radius: 16px; width: 85%; max-width: 320px; }
.modal-box input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
.modal-box button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: bold; }
</style>
</head>
<body>

<div id="nick-modal">
  <div class="modal-box">
    <h3>身份认证</h3>
    <p style="font-size:12px; color:#666; margin: 5px 0 15px 0;">新账号自动注册，老账号请直接输入</p>
    <input id="nick-input" type="text" maxlength="15" placeholder="设置昵称">
    <input id="nick-pass" type="password" placeholder="个人密码">
    <button id="nick-confirm">进入聊天室</button>
    <p id="nick-err" style="color:red; font-size:12px; margin-top:10px;"></p>
  </div>
</div>

<div id="app">
  <div id="overlay"></div>
  <div id="sidebar">
    <div style="padding:20px; color:#fff; border-bottom:1px solid #2d323e;">
      <b style="font-size:16px;">💬 通讯录</b><br>
      <small id="my-nick-badge" style="color:var(--accent);"></small>
    </div>
    <div id="public-entry" class="user-item active">
      <span class="dot online">#</span> 公开频道
    </div>
    <div id="user-list"></div>
  </div>

  <div id="main">
    <div id="chat-header">
      <button id="menu-btn" style="display:none;">☰</button>
      <div id="chat-title" style="font-weight:bold;">公开频道</div>
    </div>
    <div id="messages-wrap"></div>
    <div id="input-area">
      <textarea id="msg-input" placeholder="输入消息..." rows="1"></textarea>
      <button id="send-btn">🚀</button>
    </div>
  </div>
</div>

<script>
let myNick = '';
let currentChat = 'public';
let ws = null;
let allUsers = [];
const privateHistory = {};
const publicHistory = [];

const msgInput = document.getElementById('msg-input');
const messagesWrap = document.getElementById('messages-wrap');

function scrollBottom() {
  requestAnimationFrame(() => { messagesWrap.scrollTop = messagesWrap.scrollHeight; });
}

function adjustHeight() {
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.getElementById('app').style.height = vh + 'px';
  scrollBottom();
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', adjustHeight);

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function connectWs() {
  const pwd = document.getElementById('nick-pass').value.trim();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'nick', from: myNick, password: pwd }));
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if(msg.type === 'online') {
      allUsers = msg.user_list.filter(u => u.name !== myNick);
      updateUserList();
    } else if(msg.type === 'public') {
      publicHistory.push(msg);
      if(currentChat === 'public') appendMsgUI(msg);
    } else if(msg.type === 'private') {
      const peer = msg.from === myNick ? msg.to : msg.from;
      if(!privateHistory[peer]) privateHistory[peer] = [];
      privateHistory[peer].push(msg);
      if(currentChat === peer) appendMsgUI(msg);
    } else if(msg.type === 'system') {
      if(msg.content.includes("密码") || msg.content.includes("别处")) {
        document.getElementById('nick-modal').style.display = 'flex';
        document.getElementById('nick-err').textContent = msg.content;
        ws.close();
      } else {
        appendSystemMsg(msg.content);
      }
    }
  };
}

function updateUserList() {
  document.getElementById('user-list').innerHTML = allUsers.map(u => `
    <div class="user-item ${currentChat === u.name ? 'active' : ''}" onclick="clickUser('${u.name}')">
      <span class="dot ${u.online ? 'online' : 'offline'}">${u.online ? '●' : '○'}</span>${u.name}
    </div>
  `).join('');
}

function clickUser(nick) {
  currentChat = nick;
  document.getElementById('chat-title').textContent = '私聊: ' + nick;
  document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
  updateUserList();
  renderMessages();
  closeSidebar();
}

function renderMessages() {
  messagesWrap.innerHTML = '';
  const list = currentChat === 'public' ? publicHistory : (privateHistory[currentChat] || []);
  list.forEach(appendMsgUI);
  scrollBottom();
}

function appendMsgUI(msg) {
  const isMe = msg.from === myNick;
  const div = document.createElement('div');
  div.className = `msg-row ${isMe ? 'me' : ''}`;
  div.innerHTML = `
    <div class="avatar">${msg.from[0].toUpperCase()}</div>
    <div class="bubble">${msg.content}</div>
  `;
  messagesWrap.appendChild(div);
  scrollBottom();
}

function appendSystemMsg(text) {
  const div = document.createElement('div');
  div.style.cssText = "text-align:center; font-size:12px; color:#999; margin:10px 0;";
  div.textContent = text;
  messagesWrap.appendChild(div);
}

document.getElementById('nick-confirm').onclick = () => {
  const n = document.getElementById('nick-input').value.trim();
  const p = document.getElementById('nick-pass').value.trim();
  if(!n || !p) return;
  myNick = n;
  document.getElementById('my-nick-badge').textContent = '@' + myNick;
  document.getElementById('nick-modal').style.display = 'none';
  connectWs();
};

document.getElementById('send-btn').onclick = () => {
  const content = msgInput.value.trim();
  if(!content || !ws) return;
  ws.send(JSON.stringify({
    type: currentChat === 'public' ? 'public' : 'private',
    to: currentChat === 'public' ? '' : currentChat,
    content: content
  }));
  msgInput.value = '';
  msgInput.style.height = 'auto';
  msgInput.focus();
};

document.getElementById('public-entry').onclick = () => {
  currentChat = 'public';
  document.getElementById('chat-title').textContent = '公开频道';
  document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
  document.getElementById('public-entry').classList.add('active');
  renderMessages();
  closeSidebar();
};

document.getElementById('menu-btn').onclick = () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
};

document.getElementById('overlay').onclick = closeSidebar;

msgInput.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('send-btn').click(); } };

adjustHeight();
</script>
</body>
</html>
