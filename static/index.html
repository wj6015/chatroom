<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>宇宙公司聊天室</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --sidebar-bg: #1a1d24;
  --header-bg: #1a1d24;
  --accent: #6c63ff;
  --text-light: #cdd1db;
  --border: #e4e6ea;
  --sidebar-w: 240px;
  --header-h: 52px;
  --app-top: 0px;
  --app-height: 100svh;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, system-ui, sans-serif;
  background: #f0f2f5;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: auto;
}

body {
  position: fixed;
  inset: 0;
}

#app {
  position: fixed;
  left: 0;
  top: var(--app-top);
  width: 100vw;
  height: var(--app-height);
  background: #f0f2f5;
  overflow: hidden;
  display: flex;
}

#sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: 0.3s;
  z-index: 200;
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  background: #fff;
  min-height: 0;
}

#chat-header {
  height: var(--header-h);
  background: var(--header-bg);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
  z-index: 10;
}

#chat-header-left {
  display: flex;
  align-items: center;
  min-width: 0;
}

#chat-title {
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

#mention-bell {
  display: none;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
}

#mention-bell.show {
  display: inline-flex;
}

#mention-bell-count {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: #ff4d4f;
  color: #fff;
  font-weight: bold;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
}

#conn-status {
  display: none;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 12px;
}

#conn-status.show {
  display: inline-flex;
}

#messages-wrap {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
  overscroll-behavior: contain;
  position: relative;
}

#history-actions {
  display: flex;
  justify-content: center;
  margin-bottom: 4px;
  flex-shrink: 0;
}

#load-more-btn {
  border: none;
  background: #eef2ff;
  color: #4338ca;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
}

#load-more-btn[disabled] {
  background: #e5e7eb;
  color: #9ca3af;
  cursor: not-allowed;
}

.history-divider {
  text-align: center;
  font-size: 12px;
  color: #98a2b3;
  margin: 6px 0;
}

.history-divider span {
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 999px;
  padding: 4px 10px;
  display: inline-block;
}

#input-area {
  min-height: 60px;
  background: #fff;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  flex-shrink: 0;
  z-index: 100;
  position: relative;
}

.msg-row {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
  animation: fadeIn 0.15s ease;
  align-items: flex-start;
}

@keyframes fadeIn {
  from { opacity:0; transform:translateY(5px); }
  to { opacity:1; }
}

.msg-row.me {
  flex-direction: row-reverse;
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
  flex-shrink: 0;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
}

.msg-main {
  display: flex;
  flex-direction: column;
  max-width: 75%;
}

.msg-row.me .msg-main {
  align-items: flex-end;
}

.msg-meta {
  font-size: 12px;
  color: #667085;
  margin-bottom: 4px;
  padding: 0 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.msg-row.me .msg-meta {
  justify-content: flex-end;
}

.msg-sender {
  font-weight: 600;
  color: #4b5563;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.msg-time {
  color: #98a2b3;
  font-size: 11px;
}

.bubble {
  max-width: 100%;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
  white-space: pre-wrap;
}

.msg-row.me .bubble {
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 2px;
}

.msg-row:not(.me) .bubble {
  background: #e9ebef;
  color: #1c1e21;
  border-bottom-left-radius: 2px;
}

.msg-row.message-highlight .bubble {
  animation: mentionPulse 2.5s ease;
  box-shadow: 0 0 0 2px rgba(255, 193, 7, 0.45);
  background: #fff3cd !important;
  color: #1c1e21 !important;
}

@keyframes mentionPulse {
  0% { box-shadow: 0 0 0 0 rgba(255,193,7,0.75); }
  25% { box-shadow: 0 0 0 6px rgba(255,193,7,0.20); }
  100% { box-shadow: 0 0 0 0 rgba(255,193,7,0); }
}

.mention-text {
  color: #5b4bff;
  font-weight: 700;
}

#msg-input {
  flex: 1;
  background: #f0f2f5;
  border: none;
  border-radius: 20px;
  padding: 10px 15px;
  outline: none;
  font-size: 15px;
  max-height: 120px;
  resize: none;
  overflow-y: hidden;
}

#send-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin-left: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.user-item {
  padding:12px 20px;
  color:#cdd1db;
  cursor:pointer;
  border-bottom:1px solid #2d323e;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.user-item.active {
  background: var(--accent);
  color: #fff;
}

.dot {
  font-size: 10px;
}

.dot.online {
  color: #48cfad;
}

.dot.offline {
  color: #666;
}

.unread-badge {
  background: #ff4d4f;
  color: white;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: bold;
  margin-left: auto;
}

.public-entry-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}

.public-mention-badge {
  background: #ffa940;
  color: white;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: bold;
  margin-left: 0;
}

#mention-panel {
  position: absolute;
  left: 12px;
  right: 60px;
  bottom: calc(100% + 6px);
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.12);
  display: none;
  max-height: 300px;
  overflow-y: auto;
  z-index: 120;
}

#mention-panel.show {
  display: block;
}

.mention-group-title {
  padding: 10px 14px 6px 14px;
  font-size: 12px;
  color: #98a2b3;
  background: #fff;
  position: sticky;
  top: 0;
  z-index: 1;
}

.mention-item {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  border-bottom: 1px solid #f1f3f5;
}

.mention-item:last-child {
  border-bottom: none;
}

.mention-item.active {
  background: #f3f0ff;
}

.mention-item:hover {
  background: #f8f7ff;
}

.mention-checkbox {
  width: 16px;
  height: 16px;
  cursor: pointer;
  flex-shrink: 0;
}

.mention-item-name {
  flex: 1;
  font-size: 14px;
  color: #111827;
}

.mention-item-status {
  font-size: 12px;
  color: #98a2b3;
}

.mention-panel-footer {
  position: sticky;
  bottom: 0;
  background: #fff;
  padding: 10px 12px;
  border-top: 1px solid #eceef3;
}

#mention-insert-btn {
  width: 100%;
  border: none;
  background: var(--accent);
  color: #fff;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

#mention-insert-btn:disabled {
  background: #c7c9d6;
  cursor: not-allowed;
}

#mention-toast-list,
#system-toast-list {
  position: fixed;
  top: 62px;
  right: 12px;
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

#system-toast-list {
  top: 118px;
}

.mention-toast,
.system-toast {
  min-width: 220px;
  max-width: 300px;
  background: #1f2937;
  color: #fff;
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  animation: toastIn 0.2s ease;
  pointer-events: auto;
}

.mention-toast {
  cursor: pointer;
}

.system-toast.info {
  background: #111827;
}

.system-toast.warn {
  background: #92400e;
}

.mention-toast-title {
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 4px;
}

.mention-toast-body,
.system-toast-body {
  font-size: 13px;
  line-height: 1.4;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 680px) {
  #sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
  }

  #sidebar.open {
    transform: translateX(0);
  }

  #menu-btn {
    display: block !important;
    margin-right: 10px;
    font-size: 20px;
    background: none;
    border: none;
    color: #fff;
  }

  #mention-toast-list,
  #system-toast-list {
    left: 12px;
    right: 12px;
  }

  #mention-toast-list {
    top: 60px;
  }

  #system-toast-list {
    top: 124px;
  }

  .mention-toast,
  .system-toast {
    max-width: none;
    width: 100%;
  }
}

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  z-index: 150;
}

#overlay.show {
  display: block;
}

#nick-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-box {
  background: #fff;
  padding: 28px;
  border-radius: 16px;
  width: 85%;
  max-width: 320px;
}

.modal-box input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  outline: none;
}

.modal-box button {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-weight: bold;
}
</style>
</head>
<body>

<div id="nick-modal">
  <div class="modal-box">
    <h3>身份认证</h3>
    <p style="font-size:12px; color:#666; margin: 5px 0 15px 0;">新账号自动注册，老账号请直接登陆</p>
    <input id="nick-input" type="text" maxlength="15" placeholder="设置昵称">
    <input id="nick-pass" type="password" placeholder="个人密码">
    <button id="nick-confirm">进入聊天室</button>
    <p id="nick-err" style="color:red; font-size:12px; margin-top:10px;"></p>
  </div>
</div>

<div id="mention-toast-list"></div>
<div id="system-toast-list"></div>

<div id="app">
  <div id="overlay"></div>

  <div id="sidebar">
    <div style="padding:20px; color:#fff; border-bottom:1px solid #2d323e;">
      <b style="font-size:16px;">💬 通讯录</b><br>
      <small id="my-nick-badge" style="color:var(--accent);"></small>
    </div>

    <div id="public-entry" class="user-item active" data-chat="public">
      <div class="public-entry-wrap">
        <span class="dot online">#</span>
        <span>公开频道</span>
      </div>
      <span id="public-mention-unread" class="public-mention-badge" style="display:none;">@0</span>
      <span id="public-unread" class="unread-badge" style="display:none;"></span>
    </div>

    <div id="user-list"></div>
  </div>

  <div id="main">
    <div id="chat-header">
      <div id="chat-header-left">
        <button id="menu-btn" style="display:none;">☰</button>
        <div id="chat-title">公开频道</div>
      </div>
      <div id="header-actions">
        <div id="conn-status">连接中...</div>
        <button id="mention-bell" type="button">
          <span>@提醒</span>
          <span id="mention-bell-count">0</span>
        </button>
      </div>
    </div>

    <div id="messages-wrap"></div>

    <div id="input-area">
      <div id="mention-panel"></div>
      <textarea id="msg-input" maxlength="1000" placeholder="输入消息..." rows="1"></textarea>
      <button id="send-btn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const MAX_PUBLIC_HISTORY = 500;
const MAX_PRIVATE_HISTORY = 500;
const MAX_DOM_MESSAGES = 200;
const RECONNECT_BASE_DELAY = 2000;
const RECONNECT_MAX_DELAY = 30000;
const HEARTBEAT_INTERVAL = 30000;
const HEARTBEAT_TIMEOUT = 10000;
const MAX_PENDING_MESSAGES = 50;
const MAX_MESSAGE_LENGTH = 1000;

let myNick = '';
let myPassword = '';
let currentChat = 'public';
let ws = null;
let allUsers = [];
const privateHistory = {};
const publicHistory = [];
const publicMsgIndex = new Map();

let lastReadTimes = {};
let mentionReadMap = {};
let unreadCounts = {};
const mentionNotifications = [];

let wsManuallyClosed = false;
let reconnectAttempts = 0;
let reconnectTimer = null;
let heartbeatTimer = null;
let heartbeatTimeoutTimer = null;
let loginConfirmed = false;
let pendingMessages = [];

const historyState = {
  public: {
    loading: false,
    hasMore: true,
    oldestTs: 0,
    oldestID: 0,
  },
  private: {}
};

const unreadBoundaryMap = {};
const unreadBoundaryShown = {};

const msgInput = document.getElementById('msg-input');
const messagesWrap = document.getElementById('messages-wrap');
const mentionPanel = document.getElementById('mention-panel');
const mentionBell = document.getElementById('mention-bell');
const mentionBellCount = document.getElementById('mention-bell-count');
const mentionToastList = document.getElementById('mention-toast-list');
const systemToastList = document.getElementById('system-toast-list');
const connStatus = document.getElementById('conn-status');
const userListEl = document.getElementById('user-list');

let layoutTimer = null;
let lastAppTop = null;
let lastAppHeight = null;
let scrollTimer = null;
let mentionActiveIndex = 0;
let mentionCandidates = [];
let longPressTimer = null;
let selectedMentionUsers = new Set();

function isInputFocused() {
  return document.activeElement === msgInput;
}

function setConnStatus(text, visible = true) {
  connStatus.textContent = text;
  connStatus.classList.toggle('show', visible);
}

function showSystemToast(text, level = 'info') {
  const toast = document.createElement('div');
  toast.className = `system-toast ${level}`;
  toast.innerHTML = `<div class="system-toast-body">${escapeHtml(text)}</div>`;
  systemToastList.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

function clearHeartbeat() {
  if (heartbeatTimer) {
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
  }
  if (heartbeatTimeoutTimer) {
    clearTimeout(heartbeatTimeoutTimer);
    heartbeatTimeoutTimer = null;
  }
}

function startHeartbeat() {
  clearHeartbeat();
  heartbeatTimer = setInterval(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    try {
      ws.send(JSON.stringify({ type: 'ping' }));
      if (heartbeatTimeoutTimer) clearTimeout(heartbeatTimeoutTimer);
      heartbeatTimeoutTimer = setTimeout(() => {
        try { ws.close(); } catch {}
      }, HEARTBEAT_TIMEOUT);
    } catch {}
  }, HEARTBEAT_INTERVAL);
}

function scheduleReconnect() {
  if (wsManuallyClosed) return;
  if (!myNick || !myPassword) return;
  if (reconnectTimer) return;

  reconnectAttempts += 1;
  const delay = Math.min(RECONNECT_BASE_DELAY * (2 ** Math.max(0, reconnectAttempts - 1)), RECONNECT_MAX_DELAY);
  setConnStatus(`连接已断开，${Math.round(delay / 1000)}秒后重连...`, true);

  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connectWs(true);
  }, delay);
}

function syncViewportLayout() {
  const root = document.documentElement;
  let top = 0;
  let height = window.innerHeight;

  if (window.visualViewport) {
    top = window.visualViewport.offsetTop || 0;
    height = window.visualViewport.height || window.innerHeight;
  }

  const newTop = Math.round(top);
  const newHeight = Math.round(height);

  if (newTop !== lastAppTop) {
    root.style.setProperty('--app-top', newTop + 'px');
    lastAppTop = newTop;
  }

  if (newHeight !== lastAppHeight) {
    root.style.setProperty('--app-height', newHeight + 'px');
    lastAppHeight = newHeight;
  }

  if (isInputFocused() && window.scrollY > 0) {
    window.scrollTo(0, 0);
  }
}

function scheduleViewportLayout() {
  if (layoutTimer) clearTimeout(layoutTimer);
  layoutTimer = setTimeout(() => {
    requestAnimationFrame(() => {
      syncViewportLayout();
    });
  }, 50);
}

function autoResize() {
  msgInput.style.height = 'auto';

  if (msgInput.scrollHeight > 120) {
    msgInput.style.height = '120px';
    msgInput.style.overflowY = 'auto';
  } else {
    msgInput.style.height = msgInput.scrollHeight + 'px';
    msgInput.style.overflowY = 'hidden';
  }

  scheduleViewportLayout();

  const wrap = messagesWrap;
  if (wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 80) {
    scrollBottom();
  }
}

function scrollBottom() {
  if (scrollTimer) cancelAnimationFrame(scrollTimer);
  scrollTimer = requestAnimationFrame(() => {
    messagesWrap.scrollTop = messagesWrap.scrollHeight;
  });
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, s => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[s]));
}

function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function formatTime(ts) {
  const d = new Date(ts * 1000);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

function renderContentWithMentions(content, mentions = []) {
  let html = escapeHtml(content);
  const unique = [...new Set((mentions || []).filter(Boolean))].sort((a, b) => b.length - a.length);
  unique.forEach(name => {
    const re = new RegExp('@' + escapeRegExp(name), 'g');
    html = html.replace(re, `<span class="mention-text">@${escapeHtml(name)}</span>`);
  });
  return html;
}

function ensurePrivateState(peer) {
  if (!historyState.private[peer]) {
    historyState.private[peer] = {
      loading: false,
      hasMore: null,
      oldestTs: 0,
      oldestID: 0,
    };
  }
  return historyState.private[peer];
}

function getChatState(chat) {
  if (chat === 'public') return historyState.public;
  return ensurePrivateState(chat);
}

function updateOldestCursor(chat) {
  const state = getChatState(chat);
  const list = chat === 'public' ? publicHistory : (privateHistory[chat] || []);
  if (!list.length) {
    state.oldestTs = 0;
    state.oldestID = 0;
    return;
  }
  const oldest = list[0];
  state.oldestTs = oldest.timestamp || 0;
  state.oldestID = oldest.seq || oldest.db_id || 0;
}

function trimHistoryList(list, max, isPublic) {
  if (!Array.isArray(list)) return;
  if (list.length <= max) return;
  const removed = list.splice(0, list.length - max);
  if (isPublic) {
    for (const item of removed) {
      if (item && item.id) publicMsgIndex.delete(item.id);
    }
  }
}

function parseMentionsFromText(content) {
  if (!content) return [];
  const found = [];
  const sortedUsers = [...allUsers.map(u => u.name), myNick].filter(Boolean).sort((a, b) => b.length - a.length);

  for (let i = 0; i < content.length; i++) {
    if (content[i] !== '@') continue;

    const prev = i === 0 ? '' : content[i - 1];
    if (prev && !/\s/.test(prev)) continue;

    let matched = '';
    for (const name of sortedUsers) {
      if (content.slice(i + 1, i + 1 + name.length) === name) {
        const after = content[i + 1 + name.length] || '';
        if (after === '' || /\s|，|。|,|!|！|\?|？|:|：|;|；/.test(after)) {
          matched = name;
          break;
        }
      }
    }
    if (matched && matched !== myNick && !found.includes(matched)) found.push(matched);
  }
  return found;
}

function getAllMentionUsers() {
  return allUsers
    .filter(u => u.name !== myNick)
    .sort((a, b) => {
      if (a.online !== b.online) return a.online ? -1 : 1;
      return a.name.localeCompare(b.name, 'zh-CN');
    });
}

function getSortedMentionUsers(keyword = '') {
  const k = keyword.trim().toLowerCase();
  return getAllMentionUsers().filter(u => !k || u.name.toLowerCase().includes(k));
}

function getMentionQueryInfo() {
  if (currentChat !== 'public') return null;

  const value = msgInput.value;
  const pos = msgInput.selectionStart;
  const before = value.slice(0, pos);
  const match = before.match(/(?:^|\s)@([^\s@]*)$/);

  if (!match) return null;

  const atIndex = before.lastIndexOf('@');
  if (atIndex < 0) return null;

  const prevChar = atIndex > 0 ? before[atIndex - 1] : '';
  if (prevChar && !/\s/.test(prevChar)) return null;

  return {
    keyword: match[1] || '',
    atIndex,
    caret: pos
  };
}

function isMentionAlreadyRead(msg) {
  if (!msg || !msg.id) return false;
  return !!mentionReadMap[msg.id];
}

function shouldAddMentionNotification(msg) {
  if (!msg || msg.type !== 'public') return false;
  if (msg.from === myNick) return false;
  if (!Array.isArray(msg.mentions) || !msg.mentions.includes(myNick)) return false;
  if (isMentionAlreadyRead(msg)) return false;
  return true;
}

function renderMentionPanel() {
  const info = getMentionQueryInfo();
  if (!info) {
    hideMentionPanel();
    return;
  }

  const allMentionUsers = getAllMentionUsers();
  const filteredUsers = getSortedMentionUsers(info.keyword);

  mentionCandidates = [
    { type: 'all', name: '__ALL__', online: null }
  ];

  const onlineUsers = filteredUsers.filter(u => u.online);
  const offlineUsers = filteredUsers.filter(u => !u.online);

  let html = '';

  html += `
    <div class="mention-item ${mentionActiveIndex === 0 ? 'active' : ''}" data-type="all" data-name="__ALL__">
      <input class="mention-checkbox" type="checkbox" data-type="all-checkbox" ${isAllUsersSelected() ? 'checked' : ''}>
      <span class="mention-item-name">所有用户</span>
      <span class="mention-item-status">${allMentionUsers.length}人</span>
    </div>
  `;

  if (onlineUsers.length) {
    html += `<div class="mention-group-title">在线用户</div>`;
    onlineUsers.forEach(u => {
      mentionCandidates.push({ type: 'user', ...u });
      const idx = mentionCandidates.length - 1;
      html += `
        <div class="mention-item ${mentionActiveIndex === idx ? 'active' : ''}" data-type="user" data-name="${escapeHtml(u.name)}">
          <input class="mention-checkbox" type="checkbox" data-type="user-checkbox" data-name="${escapeHtml(u.name)}" ${selectedMentionUsers.has(u.name) ? 'checked' : ''}>
          <span class="dot online">●</span>
          <span class="mention-item-name">${escapeHtml(u.name)}</span>
          <span class="mention-item-status">在线</span>
        </div>
      `;
    });
  }

  if (offlineUsers.length) {
    html += `<div class="mention-group-title">离线用户</div>`;
    offlineUsers.forEach(u => {
      mentionCandidates.push({ type: 'user', ...u });
      const idx = mentionCandidates.length - 1;
      html += `
        <div class="mention-item ${mentionActiveIndex === idx ? 'active' : ''}" data-type="user" data-name="${escapeHtml(u.name)}">
          <input class="mention-checkbox" type="checkbox" data-type="user-checkbox" data-name="${escapeHtml(u.name)}" ${selectedMentionUsers.has(u.name) ? 'checked' : ''}>
          <span class="dot offline">○</span>
          <span class="mention-item-name">${escapeHtml(u.name)}</span>
          <span class="mention-item-status">离线</span>
        </div>
      `;
    });
  }

  html += `
    <div class="mention-panel-footer">
      <button id="mention-insert-btn" ${selectedMentionUsers.size === 0 ? 'disabled' : ''}>
        插入已选用户(${selectedMentionUsers.size})
      </button>
    </div>
  `;

  mentionPanel.innerHTML = html;
  mentionPanel.classList.add('show');
}

function showMentionPanel() {
  renderMentionPanel();
}

function hideMentionPanel() {
  mentionPanel.classList.remove('show');
  mentionPanel.innerHTML = '';
  mentionCandidates = [];
  mentionActiveIndex = 0;
  selectedMentionUsers.clear();
}

function insertMention(name, withGreeting = false) {
  const info = getMentionQueryInfo();
  const value = msgInput.value;
  let newValue = value;
  let caretPos = 0;

  if (info) {
    const before = value.slice(0, info.atIndex);
    const after = value.slice(info.caret);
    const mentionText = withGreeting ? `@${name} 在吗 ` : `@${name} `;
    newValue = before + mentionText + after;
    caretPos = (before + mentionText).length;
  } else {
    const prefix = value && !/\s$/.test(value) ? value + ' ' : value;
    const mentionText = withGreeting ? `@${name} 在吗 ` : `@${name} `;
    newValue = prefix + mentionText;
    caretPos = newValue.length;
  }

  msgInput.value = newValue;
  msgInput.focus();
  msgInput.setSelectionRange(caretPos, caretPos);
  autoResize();
  hideMentionPanel();
}

function insertMultipleMentions(names) {
  const validNames = [...new Set(names.filter(Boolean))];
  if (!validNames.length) return;

  const info = getMentionQueryInfo();
  const value = msgInput.value;
  const mentionText = validNames.map(name => `@${name}`).join(' ') + ' ';
  let newValue = value;
  let caretPos = 0;

  if (info) {
    const before = value.slice(0, info.atIndex);
    const after = value.slice(info.caret);
    newValue = before + mentionText + after;
    caretPos = (before + mentionText).length;
  } else {
    const prefix = value && !/\s$/.test(value) ? value + ' ' : value;
    newValue = prefix + mentionText;
    caretPos = newValue.length;
  }

  msgInput.value = newValue;
  msgInput.focus();
  msgInput.setSelectionRange(caretPos, caretPos);
  autoResize();
  hideMentionPanel();
}

function insertAllUsersMention() {
  const names = getAllMentionUsers().map(u => u.name);
  insertMultipleMentions(names);
}

function isAllUsersSelected() {
  const allNames = getAllMentionUsers().map(u => u.name);
  if (!allNames.length) return false;
  return allNames.every(name => selectedMentionUsers.has(name));
}

function toggleSelectAllUsers(checked) {
  const allNames = getAllMentionUsers().map(u => u.name);
  if (checked) allNames.forEach(name => selectedMentionUsers.add(name));
  else allNames.forEach(name => selectedMentionUsers.delete(name));
  renderMentionPanel();
}

function toggleSelectOneUser(name, checked) {
  if (!name) return;
  if (checked) selectedMentionUsers.add(name);
  else selectedMentionUsers.delete(name);
  renderMentionPanel();
}

function insertSelectedMentionUsers() {
  const names = getAllMentionUsers().map(u => u.name).filter(name => selectedMentionUsers.has(name));
  insertMultipleMentions(names);
}

function updateMentionBell() {
  const count = mentionNotifications.length;
  mentionBellCount.textContent = count;
  mentionBell.classList.toggle('show', count > 0);

  const badge = document.getElementById('public-mention-unread');
  badge.style.display = count > 0 ? 'inline-flex' : 'none';
  badge.textContent = '@' + count;
}

function pushMentionNotification(msg) {
  if (!msg || !msg.id) return;
  if (mentionNotifications.some(x => x.id === msg.id)) return;
  mentionNotifications.push(msg);
  updateMentionBell();
}

function removeMentionNotificationByID(id) {
  const idx = mentionNotifications.findIndex(x => x.id === id);
  if (idx >= 0) {
    mentionNotifications.splice(idx, 1);
    updateMentionBell();
  }
}

function consumeNextMentionNotification() {
  if (!mentionNotifications.length) return null;
  const item = mentionNotifications.shift();
  updateMentionBell();
  return item;
}

function markMentionReadLocal(id) {
  if (!id) return;
  mentionReadMap[id] = true;
  removeMentionNotificationByID(id);
}

function sendWs(data) {
  const raw = JSON.stringify(data);
  if (ws && ws.readyState === WebSocket.OPEN && loginConfirmed) {
    ws.send(raw);
    return true;
  }
  pendingMessages.push(raw);
  if (pendingMessages.length > MAX_PENDING_MESSAGES) {
    pendingMessages = pendingMessages.slice(-MAX_PENDING_MESSAGES);
  }
  return false;
}

function flushPendingMessages() {
  if (!ws || ws.readyState !== WebSocket.OPEN || !loginConfirmed) return;
  if (!pendingMessages.length) return;
  const list = pendingMessages.slice();
  pendingMessages = [];
  for (const raw of list) {
    try { ws.send(raw); } catch {}
  }
}

function markMentionReadRemote(id) {
  if (!id) return;
  sendWs({ type: 'mention_read_ack', content: id });
}

function showMentionToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'mention-toast';
  toast.innerHTML = `
    <div class="mention-toast-title">${escapeHtml(msg.from)} @了你</div>
    <div class="mention-toast-body">${escapeHtml(msg.content)}</div>
  `;
  toast.onclick = () => {
    if (!isMentionAlreadyRead(msg)) {
      markMentionReadLocal(msg.id);
      markMentionReadRemote(msg.id);
    }
    jumpToMessage(msg.id);
    toast.remove();
  };
  mentionToastList.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

function updateUserList() {
  const pubCount = unreadCounts['public'] || 0;
  const pubBadge = document.getElementById('public-unread');
  pubBadge.style.display = pubCount > 0 ? 'block' : 'none';
  pubBadge.textContent = pubCount;

  userListEl.innerHTML = allUsers.map(u => {
    const count = unreadCounts[u.name] || 0;
    const badge = count > 0 ? `<span class="unread-badge">${count}</span>` : '';
    return `
      <div class="user-item ${currentChat === u.name ? 'active' : ''}" data-chat="${escapeHtml(u.name)}">
        <span class="dot ${u.online ? 'online' : 'offline'}">${u.online ? '●' : '○'}</span>
        <span style="flex:1">${escapeHtml(u.name)}</span>
        ${badge}
      </div>
    `;
  }).join('');

  updateMentionBell();
}

function maybeRecordUnreadBoundary(chat) {
  if (unreadBoundaryMap[chat] !== undefined) return;
  const count = unreadCounts[chat] || 0;
  if (count > 0) {
    unreadBoundaryMap[chat] = lastReadTimes[chat] || 0;
    unreadBoundaryShown[chat] = false;
  }
}

function clickUser(nick) {
  maybeRecordUnreadBoundary(nick);

  currentChat = nick;

  delete unreadCounts[nick];
  const nowTs = Math.floor(Date.now() / 1000);
  lastReadTimes[nick] = nowTs;
  sendWs({ type: 'read_ack', to: nick === 'public' ? '' : nick });

  if (nick === 'public') {
    for (const msg of publicHistory) {
      const mentionedMe = Array.isArray(msg.mentions) && msg.mentions.includes(myNick);
      if (mentionedMe && !isMentionAlreadyRead(msg)) {
        markMentionReadLocal(msg.id);
        markMentionReadRemote(msg.id);
      }
    }
  }

  document.getElementById('chat-title').textContent = nick === 'public' ? '公开频道' : '私聊: ' + nick;
  updateUserList();
  renderMessages();
  closeSidebar();
  hideMentionPanel();
}

function createDividerNode() {
  const div = document.createElement('div');
  div.className = 'history-divider';
  div.dataset.unreadBoundary = '1';
  div.innerHTML = `<span>以上为更早的已读历史</span>`;
  return div;
}

function renderHistoryActions() {
  const state = getChatState(currentChat);
  const div = document.createElement('div');
  div.id = 'history-actions';

  const btn = document.createElement('button');
  btn.id = 'load-more-btn';

  const hasMoreKnownFalse = state.hasMore === false;
  const loading = !!state.loading;

  btn.textContent = loading ? '加载中...' : (hasMoreKnownFalse ? '没有更多消息' : '加载更多消息');
  btn.disabled = loading || hasMoreKnownFalse;
  btn.onclick = () => loadMoreHistory();

  div.appendChild(btn);
  return div;
}

function createLongPressHandlers(target, name) {
  const start = () => {
    if (!name || name === myNick) return;
    longPressTimer = setTimeout(() => insertMentionDirect(name), 450);
  };

  const clear = () => {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
  };

  target.addEventListener('touchstart', start, { passive: true });
  target.addEventListener('touchend', clear);
  target.addEventListener('touchcancel', clear);
  target.addEventListener('mousedown', start);
  target.addEventListener('mouseup', clear);
  target.addEventListener('mouseleave', clear);
}

function insertMentionDirect(name) {
  const value = msgInput.value;
  const prefix = value && !/\s$/.test(value) ? value + ' ' : value;
  const newValue = prefix + `@${name} `;
  msgInput.value = newValue;
  msgInput.focus();
  msgInput.setSelectionRange(newValue.length, newValue.length);
  autoResize();
  hideMentionPanel();
}

function buildMessageNode(msg) {
  const isMe = msg.from === myNick;
  const div = document.createElement('div');
  div.className = `msg-row ${isMe ? 'me' : ''}`;

  if (msg.id) {
    div.dataset.id = msg.id;
    if (msg.type === 'public') {
      publicMsgIndex.set(msg.id, div);
    }
  }

  div.dataset.timestamp = String(msg.timestamp || 0);

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = (msg.from || '?')[0]?.toUpperCase?.() || '?';
  avatar.dataset.user = msg.from || '';

  const msgMain = document.createElement('div');
  msgMain.className = 'msg-main';

  const meta = document.createElement('div');
  meta.className = 'msg-meta';

  const sender = document.createElement('span');
  sender.className = 'msg-sender';
  sender.textContent = msg.from || '';
  sender.dataset.user = msg.from || '';

  const timeEl = document.createElement('span');
  timeEl.className = 'msg-time';
  timeEl.textContent = formatTime(msg.timestamp || Math.floor(Date.now() / 1000));

  meta.appendChild(sender);
  meta.appendChild(timeEl);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderContentWithMentions(msg.content || '', msg.mentions || []);

  msgMain.appendChild(meta);
  msgMain.appendChild(bubble);
  div.appendChild(avatar);
  div.appendChild(msgMain);

  createLongPressHandlers(avatar, msg.from);
  createLongPressHandlers(sender, msg.from);

  return div;
}

function appendMsgUIWithoutScroll(msg) {
  messagesWrap.appendChild(buildMessageNode(msg));
}

function trimMessageDom() {
  const rows = messagesWrap.querySelectorAll('.msg-row');
  if (rows.length <= MAX_DOM_MESSAGES) return;

  const removeCount = rows.length - MAX_DOM_MESSAGES;
  for (let i = 0; i < removeCount; i++) {
    const node = rows[i];
    if (node.dataset && node.dataset.id) publicMsgIndex.delete(node.dataset.id);
    node.remove();
  }
}

function appendMsgUI(msg) {
  const nearBottom = messagesWrap.scrollHeight - messagesWrap.scrollTop - messagesWrap.clientHeight < 80;
  messagesWrap.appendChild(buildMessageNode(msg));
  trimMessageDom();
  insertBoundaryDividerIfNeeded(currentChat);
  if (nearBottom) scrollBottom();

  const mentionedMe = Array.isArray(msg.mentions) && msg.mentions.includes(myNick);
  if (msg.type === 'public' && mentionedMe && msg.from !== myNick && currentChat === 'public') {
    flashMessageById(msg.id);
  }
}

function flashMessageById(id) {
  if (!id) return;
  const el = messagesWrap.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  el.classList.remove('message-highlight');
  void el.offsetWidth;
  el.classList.add('message-highlight');
  setTimeout(() => el.classList.remove('message-highlight'), 2600);
}

function jumpToMessage(id) {
  if (!id) return;
  if (currentChat !== 'public') clickUser('public');

  requestAnimationFrame(() => {
    const el = messagesWrap.querySelector(`[data-id="${id}"]`);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => flashMessageById(id), 250);
  });
}

function appendSystemMsg(text) {
  const div = document.createElement('div');
  div.style.cssText = "text-align:center; font-size:12px; color:#999; margin:10px 0;";
  div.textContent = text;
  messagesWrap.appendChild(div);
  trimMessageDom();
}

function resetRuntimeOnFreshLogin() {
  allUsers = [];
  publicHistory.length = 0;
  Object.keys(privateHistory).forEach(k => delete privateHistory[k]);
  publicMsgIndex.clear();
  unreadCounts = {};
  lastReadTimes = {};
  mentionNotifications.length = 0;
  mentionReadMap = {};
  pendingMessages = [];
  Object.keys(historyState.private).forEach(k => delete historyState.private[k]);
  historyState.public = { loading: false, hasMore: true, oldestTs: 0, oldestID: 0 };
  Object.keys(unreadBoundaryMap).forEach(k => delete unreadBoundaryMap[k]);
  Object.keys(unreadBoundaryShown).forEach(k => delete unreadBoundaryShown[k]);
  messagesWrap.innerHTML = '';
  updateMentionBell();
}

function sortMessagesAsc(list) {
  list.sort((a, b) => {
    if ((a.timestamp || 0) !== (b.timestamp || 0)) return (a.timestamp || 0) - (b.timestamp || 0);
    return (a.seq || a.db_id || 0) - (b.seq || b.db_id || 0);
  });
}

function makeMsgKey(m) {
  return m.id || `${m.type}_${m.from}_${m.to}_${m.timestamp}_${m.content}`;
}

function dedupeAndInsertMessages(chat, newMessages, prepend = false) {
  if (!Array.isArray(newMessages) || !newMessages.length) return;

  const targetList = chat === 'public' ? publicHistory : (privateHistory[chat] || (privateHistory[chat] = []));
  const seen = new Set(targetList.map(makeMsgKey));
  const filtered = [];

  for (const m of newMessages) {
    const key = makeMsgKey(m);
    if (!seen.has(key)) {
      seen.add(key);
      filtered.push(m);
    }
  }
  if (!filtered.length) return;

  if (prepend) {
    targetList.unshift(...filtered);
  } else {
    targetList.push(...filtered);
  }

  sortMessagesAsc(targetList);
  trimHistoryList(targetList, chat === 'public' ? MAX_PUBLIC_HISTORY : MAX_PRIVATE_HISTORY, chat === 'public');
  updateOldestCursor(chat);
}

function handleIncomingChatMessage(msg) {
  const isPublic = msg.type === 'public';
  const peer = isPublic ? 'public' : (msg.from === myNick ? msg.to : msg.from);
  if (!isPublic) ensurePrivateState(peer);

  dedupeAndInsertMessages(peer, [msg], false);

  if (msg.from !== myNick && currentChat !== peer) {
    unreadCounts[peer] = (unreadCounts[peer] || 0) + 1;
  }

  if (shouldAddMentionNotification(msg)) {
    pushMentionNotification(msg);
    if (currentChat === 'public') showMentionToast(msg);
  }

  if (currentChat === peer) appendMsgUI(msg);
  updateUserList();
}

function getBoundaryInsertInfo(chat) {
  if (!unreadBoundaryShown[chat]) return null;
  if (unreadBoundaryMap[chat] === undefined) return null;

  const boundaryTs = unreadBoundaryMap[chat];
  const rows = [...messagesWrap.querySelectorAll('.msg-row')];
  let targetRow = null;

  for (const row of rows) {
    const ts = parseInt(row.dataset.timestamp || '0', 10);
    if (ts <= boundaryTs) {
      targetRow = row;
      break;
    }
  }

  return { targetRow, boundaryTs };
}

function insertBoundaryDividerIfNeeded(chat) {
  const old = messagesWrap.querySelector('.history-divider[data-unread-boundary="1"]');
  if (old) old.remove();

  const info = getBoundaryInsertInfo(chat);
  if (!info || !info.targetRow) return;

  const divider = createDividerNode();
  messagesWrap.insertBefore(divider, info.targetRow);
}

function renderMessages(options = {}) {
  const shouldScrollBottom = options.scrollBottom !== false;

  messagesWrap.innerHTML = '';
  publicMsgIndex.clear();

  messagesWrap.appendChild(renderHistoryActions());

  const list = currentChat === 'public' ? publicHistory : (privateHistory[currentChat] || []);
  list.forEach(appendMsgUIWithoutScroll);

  trimMessageDom();
  insertBoundaryDividerIfNeeded(currentChat);

  if (shouldScrollBottom) {
    scrollBottom();
  }
}

function checkUnreadBoundaryCross(chat, loadedMessages) {
  if (!Array.isArray(loadedMessages) || !loadedMessages.length) return;
  if (unreadBoundaryShown[chat]) return;
  if (unreadBoundaryMap[chat] === undefined) return;

  const boundaryTs = unreadBoundaryMap[chat];
  const crossed = loadedMessages.some(m => (m.timestamp || 0) <= boundaryTs);
  if (!crossed) return;

  unreadBoundaryShown[chat] = true;

  if (currentChat === chat) {
    renderMessages();
    showSystemToast('目前已无未读消息，以下为更早的已读历史', 'info');
  }
}

function findLatestUnreadMessageInBatch(chat, messages) {
  if (!Array.isArray(messages) || !messages.length) return null;
  if (unreadBoundaryMap[chat] === undefined) return null;

  const boundaryTs = unreadBoundaryMap[chat];

  // messages 是按时间升序排列的
  // 找到“最后一条未读消息” = 最接近已读边界的未读消息
  for (let i = messages.length - 1; i >= 0; i--) {
    const m = messages[i];
    if ((m.timestamp || 0) > boundaryTs) {
      return m;
    }
  }
  return null;
}
  
function findLatestMessageInBatch(messages) {
  if (!Array.isArray(messages) || !messages.length) return null;
  // messages 按时间升序排列，最后一条就是这批新加载内容里“最新”的消息
  return messages[messages.length - 1] || null;
}

function scrollMessageNearInputById(id) {
  if (!id) return;

  requestAnimationFrame(() => {
    const el = messagesWrap.querySelector(`[data-id="${id}"]`);
    if (!el) return;

    // 让目标消息靠近输入框上方，而不是居中
    const targetTop = el.offsetTop - messagesWrap.clientHeight + el.offsetHeight + 24;
    messagesWrap.scrollTop = Math.max(0, targetTop);
  });
}

function loadMoreHistory() {
  const state = getChatState(currentChat);
  if (state.loading) return;
  if (state.hasMore === false) return;

  // 关键修复：
  // 如果当前会话还有未读，但用户没有重新点击左侧会话，
  // 那么第一次直接点“加载更多”时，也要补记未读边界。
  maybeRecordUnreadBoundary(currentChat);

  state.loading = true;
  renderMessages({ scrollBottom: false });

  const payload = {
    type: 'load_more',
    to: currentChat === 'public' ? '' : currentChat,
    timestamp: state.oldestTs || 0,
    seq: state.oldestID || 0
  };

  sendWs(payload);
}

function connectWs(isReconnect = false) {
  if (!myNick || !myPassword) return;

  wsManuallyClosed = false;
  loginConfirmed = false;
  clearHeartbeat();

  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }

  if (!isReconnect) {
    reconnectAttempts = 0;
    resetRuntimeOnFreshLogin();
  }

  setConnStatus(isReconnect ? '正在重连...' : '正在连接...', true);

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    reconnectAttempts = 0;
    setConnStatus('已连接，正在同步...', true);
    ws.send(JSON.stringify({ type: 'nick', from: myNick, password: myPassword }));
    startHeartbeat();
  };

  ws.onmessage = (e) => {
    let msg;
    try {
      msg = JSON.parse(e.data);
    } catch {
      return;
    }

    if (msg.type === 'pong') {
      if (heartbeatTimeoutTimer) {
        clearTimeout(heartbeatTimeoutTimer);
        heartbeatTimeoutTimer = null;
      }
      return;
    }

    if (!loginConfirmed && ['read_sync', 'mention_read_sync', 'unread_sync', 'history_done', 'online', 'public', 'private', 'system'].includes(msg.type)) {
      loginConfirmed = true;
      setConnStatus('', false);
      flushPendingMessages();
    }

    if (msg.type === 'read_sync') {
      try {
        lastReadTimes = msg.last_read_map || JSON.parse(msg.content || '{}') || {};
      } catch {
        lastReadTimes = {};
      }
    } else if (msg.type === 'mention_read_sync') {
      try {
        mentionReadMap = JSON.parse(msg.content || '{}') || {};
      } catch {
        mentionReadMap = {};
      }
    } else if (msg.type === 'unread_sync') {
      unreadCounts = msg.unread_map || {};
      updateUserList();
      
    } else if (msg.type === 'history_page') {
      const chat = msg.to || 'public';
      const messages = Array.isArray(msg.messages) ? msg.messages : [];
      const state = getChatState(chat);
      state.loading = false;
      state.hasMore = !!msg.has_more;

      let prevHeight = 0;
      let prevTop = 0;
      const isCurrentChat = currentChat === chat;

      if (isCurrentChat) {
        prevHeight = messagesWrap.scrollHeight;
        prevTop = messagesWrap.scrollTop;
      }

      const latestUnreadMsg = findLatestUnreadMessageInBatch(chat, messages);

      if (messages.length) {
        dedupeAndInsertMessages(chat, messages, true);
        checkUnreadBoundaryCross(chat, messages);
      }

      if (isCurrentChat) {
        renderMessages({ scrollBottom: false });

        // 仅在“本次新加载批次中仍有未读消息”时，
        // 自动停到最新未读消息附近。
        if (latestUnreadMsg && latestUnreadMsg.id) {
          scrollMessageNearInputById(latestUnreadMsg.id);
        } else {
          // 纯已读历史翻页：保持原相对位置，继续自然往上阅读
          requestAnimationFrame(() => {
            const newHeight = messagesWrap.scrollHeight;
            messagesWrap.scrollTop = Math.max(0, newHeight - prevHeight + prevTop);
          });
        }
      }
    } else if (msg.type === 'history_done') {
      if (Array.isArray(msg.messages) && msg.messages.length) {
        for (const m of msg.messages) {
          const peer = m.type === 'public' ? 'public' : (m.from === myNick ? m.to : m.from);
          if (peer !== 'public') ensurePrivateState(peer);
          dedupeAndInsertMessages(peer, [m], false);
        }
      }

      historyState.public.hasMore = !!msg.public_has_more;
      updateOldestCursor('public');

      const privateMore = msg.private_has_more_map || {};
      Object.keys(privateHistory).forEach(peer => {
        const st = ensurePrivateState(peer);
        if (Object.prototype.hasOwnProperty.call(privateMore, peer)) {
          st.hasMore = !!privateMore[peer];
        } else if (st.hasMore === null) {
          st.hasMore = true;
        }
        updateOldestCursor(peer);
      });

      renderMessages();
      updateUserList();
      setConnStatus('', false);
    } else if (msg.type === 'online') {
      allUsers = (msg.user_list || []).filter(u => u.name !== myNick);
      updateUserList();
      if (currentChat === 'public' && document.activeElement === msgInput) {
        showMentionPanel();
      }
    } else if (msg.type === 'public' || msg.type === 'private') {
      handleIncomingChatMessage(msg);
    } else if (msg.type === 'system') {
      if (msg.content.includes("密码") || msg.content.includes("别处") || msg.content.includes("昵称")) {
        wsManuallyClosed = true;
        loginConfirmed = false;
        document.getElementById('nick-modal').style.display = 'flex';
        document.getElementById('nick-err').textContent = msg.content;
        setConnStatus('', false);
        try { ws.close(); } catch {}
      } else {
        appendSystemMsg(msg.content);
        showSystemToast(msg.content, 'warn');
      }
    }
  };

  ws.onerror = () => setConnStatus('连接异常', true);

  ws.onclose = () => {
    clearHeartbeat();
    loginConfirmed = false;
    if (!wsManuallyClosed) scheduleReconnect();
  };
}

document.getElementById('nick-confirm').onclick = () => {
  const n = document.getElementById('nick-input').value.trim();
  const p = document.getElementById('nick-pass').value.trim();
  if (!n || !p) return;

  myNick = n;
  myPassword = p;
  currentChat = 'public';

  document.getElementById('my-nick-badge').textContent = '@' + myNick;
  document.getElementById('nick-err').textContent = '';
  document.getElementById('nick-modal').style.display = 'none';
  connectWs(false);
};

document.getElementById('send-btn').onclick = () => {
  const content = msgInput.value.trim();
  if (!content) return;
  if (content.length > MAX_MESSAGE_LENGTH) {
    showSystemToast(`消息不能超过 ${MAX_MESSAGE_LENGTH} 个字符`, 'warn');
    return;
  }

  const payload = {
    type: currentChat === 'public' ? 'public' : 'private',
    to: currentChat === 'public' ? '' : currentChat,
    content
  };

  if (currentChat === 'public') {
    payload.mentions = parseMentionsFromText(content);
  }

  const sent = sendWs(payload);
  if (sent || (myNick && myPassword)) {
    msgInput.value = '';
    autoResize();
    hideMentionPanel();
    msgInput.focus();
  }
};

document.getElementById('public-entry').onclick = () => clickUser('public');

document.getElementById('menu-btn').onclick = () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
};

document.getElementById('overlay').onclick = closeSidebar;

mentionBell.onclick = () => {
  const item = consumeNextMentionNotification();
  if (!item) return;
  if (!isMentionAlreadyRead(item)) {
    markMentionReadLocal(item.id);
    markMentionReadRemote(item.id);
  }
  jumpToMessage(item.id);
};

mentionPanel.addEventListener('mousedown', (e) => e.preventDefault());

mentionPanel.addEventListener('click', (e) => {
  const checkbox = e.target.closest('.mention-checkbox');
  if (checkbox) {
    e.stopPropagation();
    if (checkbox.dataset.type === 'all-checkbox') return toggleSelectAllUsers(checkbox.checked);
    if (checkbox.dataset.type === 'user-checkbox') return toggleSelectOneUser(checkbox.dataset.name, checkbox.checked);
  }

  const insertBtn = e.target.closest('#mention-insert-btn');
  if (insertBtn) {
    if (!selectedMentionUsers.size) return;
    return insertSelectedMentionUsers();
  }

  const item = e.target.closest('.mention-item');
  if (!item) return;

  const type = item.dataset.type;
  const name = item.dataset.name;
  if (type === 'all') return insertAllUsersMention();
  if (type === 'user') return insertMention(name, false);
});

userListEl.addEventListener('click', (e) => {
  const item = e.target.closest('.user-item');
  if (!item) return;
  const nick = item.dataset.chat;
  if (!nick) return;
  clickUser(nick);
});

messagesWrap.addEventListener('click', (e) => {
  if (e.target.closest('#load-more-btn')) return;
  const userEl = e.target.closest('[data-user]');
  if (!userEl) return;
  const name = userEl.dataset.user;
  if (!name || name === myNick) return;
  clickUser(name);
});

msgInput.onkeydown = (e) => {
  if (mentionPanel.classList.contains('show') && mentionCandidates.length) {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      mentionActiveIndex = (mentionActiveIndex + 1) % mentionCandidates.length;
      renderMentionPanel();
      return;
    }

    if (e.key === 'ArrowUp') {
      e.preventDefault();
      mentionActiveIndex = (mentionActiveIndex - 1 + mentionCandidates.length) % mentionCandidates.length;
      renderMentionPanel();
      return;
    }

    if (e.key === 'Enter' && !e.shiftKey) {
      const info = getMentionQueryInfo();
      if (info) {
        e.preventDefault();
        const item = mentionCandidates[mentionActiveIndex];
        if (!item) return;

        if (item.type === 'all') insertAllUsersMention();
        else insertMention(item.name, false);
        return;
      }
    }

    if (e.key === 'Escape') {
      hideMentionPanel();
      return;
    }
  }

  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('send-btn').click();
  }
};

msgInput.addEventListener('input', () => {
  if (msgInput.value.length > MAX_MESSAGE_LENGTH) {
    msgInput.value = msgInput.value.slice(0, MAX_MESSAGE_LENGTH);
  }
  autoResize();
  if (currentChat === 'public') showMentionPanel();
  else hideMentionPanel();
});

msgInput.addEventListener('click', () => {
  if (currentChat === 'public') showMentionPanel();
});

msgInput.addEventListener('focus', () => {
  scheduleViewportLayout();
  setTimeout(() => scrollBottom(), 150);
  if (currentChat === 'public') setTimeout(showMentionPanel, 0);
});

msgInput.addEventListener('blur', () => {
  scheduleViewportLayout();
  setTimeout(() => {
    if (document.activeElement !== msgInput) hideMentionPanel();
  }, 120);
});

syncViewportLayout();

window.addEventListener('resize', scheduleViewportLayout);
window.addEventListener('orientationchange', () => setTimeout(scheduleViewportLayout, 300));

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', scheduleViewportLayout);
  window.visualViewport.addEventListener('scroll', scheduleViewportLayout);
}
</script>
</body>
