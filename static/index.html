
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>聊天室</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #f0f2f5;
  --sidebar-bg: #1a1d24;
  --sidebar-header: #13151b;
  --panel-bg: #ffffff;
  --header-bg: #1a1d24;
  --accent: #6c63ff;
  --accent2: #48cfad;
  --danger: #e74c3c;
  --text: #1c1e21;
  --text-muted: #90949c;
  --text-light: #cdd1db;
  --bubble-me: #6c63ff;
  --bubble-other: #e9ebef;
  --bubble-me-text: #fff;
  --bubble-other-text: #1c1e21;
  --border: #e4e6ea;
  --input-bg: #f0f2f5;
  --sidebar-w: 240px;
  --header-h: 52px;
  --input-area-h: 68px;
}
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); }

/* ===== Layout ===== */
#app {
  display: flex;
  height: 100%;
  height: 100dvh;
}

/* ===== Sidebar ===== */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 200;
  transition: transform 0.26s cubic-bezier(.4,0,.2,1);
}
#sidebar-header {
  background: var(--sidebar-header);
  padding: 0 16px;
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#sidebar-header .title {
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .3px;
}
#sidebar-header .nick-badge {
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  padding: 2px 9px;
  border-radius: 99px;
  max-width: 110px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#user-list-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
#user-list-wrap::-webkit-scrollbar { width: 4px; }
#user-list-wrap::-webkit-scrollbar-track { background: transparent; }
#user-list-wrap::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

.user-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  cursor: pointer;
  border-radius: 8px;
  margin: 0 8px 2px;
  transition: background .15s;
  color: var(--text-light);
  font-size: 14px;
  position: relative;
}
.user-item:hover { background: rgba(255,255,255,.07); }
.user-item.active { background: var(--accent); color: #fff; }
.user-item .avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.user-item.active .avatar { background: rgba(255,255,255,.25); }
.user-item .u-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.user-item .u-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent2);
  flex-shrink: 0;
}
.user-item .u-unread {
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 99px;
  min-width: 18px;
  text-align: center;
}

.section-label {
  color: #555e6e;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 12px 16px 4px;
}

/* public channel entry */
#public-entry {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 8px;
  margin: 4px 8px 2px;
  color: var(--text-light);
  font-size: 14px;
  font-weight: 600;
  transition: background .15s;
}
#public-entry:hover { background: rgba(255,255,255,.07); }
#public-entry.active { background: var(--accent); color: #fff; }
#public-entry .pub-icon {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: #2a2d36;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
#public-entry.active .pub-icon { background: rgba(255,255,255,.2); }

/* ===== Main Area ===== */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--panel-bg);
}

/* ===== Chat Header ===== */
#chat-header {
  height: var(--header-h);
  background: var(--header-bg);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
  z-index: 10;
}
#menu-btn {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  border-radius: 6px;
  color: #ccc;
  font-size: 20px;
  line-height: 1;
  transition: background .15s;
}
#menu-btn:hover { background: rgba(255,255,255,.1); }
#chat-title {
  flex: 1;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#chat-status {
  color: var(--text-muted);
  font-size: 12px;
}
#online-count {
  color: var(--accent2);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 4px;
}
#online-count::before {
  content: '';
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent2);
}

/* ===== Messages Area ===== */
#messages-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
#messages-wrap::-webkit-scrollbar { width: 5px; }
#messages-wrap::-webkit-scrollbar-track { background: transparent; }
#messages-wrap::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  max-width: 100%;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; } }
.msg-row.me { flex-direction: row-reverse; }
.msg-row .avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.msg-row .bubble-wrap {
  display: flex;
  flex-direction: column;
  max-width: min(70%, 420px);
}
.msg-row.me .bubble-wrap { align-items: flex-end; }
.msg-row .sender {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 3px;
  padding: 0 4px;
}
.msg-row.me .sender { text-align: right; }
.bubble {
  padding: 9px 13px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
  position: relative;
}
.msg-row:not(.me) .bubble {
  background: var(--bubble-other);
  color: var(--bubble-other-text);
  border-bottom-left-radius: 4px;
}
.msg-row.me .bubble {
  background: var(--bubble-me);
  color: var(--bubble-me-text);
  border-bottom-right-radius: 4px;
}
.bubble .ts {
  font-size: 10px;
  opacity: .6;
  margin-top: 3px;
  display: block;
  text-align: right;
}
.system-msg {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  padding: 4px 0;
  user-select: none;
}

/* ===== Input Area ===== */
#input-area {
  height: var(--input-area-h);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 10px;
  background: var(--panel-bg);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  /* iOS safe area */
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#msg-input {
  flex: 1;
  background: var(--input-bg);
  border: 1.5px solid transparent;
  border-radius: 22px;
  padding: 10px 16px;
  font-size: 14px;
  outline: none;
  resize: none;
  max-height: 100px;
  height: 42px;
  overflow-y: auto;
  transition: border-color .2s;
  font-family: inherit;
  line-height: 1.4;
  -webkit-appearance: none;
}
#msg-input:focus { border-color: var(--accent); }
#send-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .15s, transform .1s;
  color: white;
}
#send-btn:hover { background: #5853e0; }
#send-btn:active { transform: scale(.92); }
#send-btn svg { width: 18px; height: 18px; fill: #fff; }

/* ===== Overlay (mobile sidebar) ===== */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 190;
}

/* ===== Nick Modal ===== */
#nick-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#nick-modal.hidden { display: none; }
.modal-box {
  background: #fff;
  border-radius: 16px;
  padding: 28px 24px;
  width: 100%;
  max-width: 340px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.modal-box h2 { font-size: 19px; margin-bottom: 6px; color: var(--text); }
.modal-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
.modal-box input {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
  font-family: inherit;
}
.modal-box input:focus { border-color: var(--accent); }
.modal-box button {
  width: 100%;
  margin-top: 12px;
  padding: 13px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
}
.modal-box button:hover { background: #5853e0; }
.modal-err { color: var(--danger); font-size: 12px; margin-top: 8px; min-height: 16px; }

/* ===== Toast ===== */
#toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(-16px);
  background: #333;
  color: #fff;
  padding: 9px 18px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .25s;
  white-space: nowrap;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===== Connection banner ===== */
#conn-banner {
  display: none;
  background: #e74c3c;
  color: #fff;
  text-align: center;
  font-size: 12px;
  padding: 5px;
  flex-shrink: 0;
}

/* ===== Mobile ===== */
@media (max-width: 680px) {
  #menu-btn { display: flex; }
  #sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    transform: translateX(-100%);
  }
  #sidebar.open {
    transform: translateX(0);
    box-shadow: 4px 0 24px rgba(0,0,0,.35);
  }
  #overlay.show { display: block; }
  .msg-row .bubble-wrap { max-width: min(80%, 320px); }
  #input-area { padding: 0 10px; gap: 8px; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
</style>
</head>
<body>

<!-- Nick Modal -->
<div id="nick-modal">
  <div class="modal-box">
    <h2>👋 设置昵称</h2>
    <p>请输入你的聊天昵称（2-20字符）</p>
    <input id="nick-input" type="text" maxlength="20" placeholder="你的昵称" autocomplete="off" />
    <button id="nick-confirm">进入聊天室</button>
    <div class="modal-err" id="nick-err"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Main App -->
<div id="app">

  <!-- Overlay (mobile) -->
  <div id="overlay"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <span class="title">💬 聊天室</span>
      <span class="nick-badge" id="my-nick-badge">未登录</span>
    </div>
    <div id="user-list-wrap">
      <div class="section-label">频道</div>
      <div id="public-entry" class="active">
        <div class="pub-icon">＃</div>
        <span>公开频道</span>
      </div>
      <div class="section-label">在线用户</div>
      <div id="user-list"></div>
    </div>
  </div>

  <!-- Main Chat Panel -->
  <div id="main">
    <div id="conn-banner">⚠ 连接已断开，正在重连…</div>
    <div id="chat-header">
      <button id="menu-btn" aria-label="菜单">☰</button>
      <div style="flex:1;min-width:0;">
        <div id="chat-title">公开频道</div>
      </div>
      <div id="online-count">0 人在线</div>
    </div>
    <div id="messages-wrap" role="log" aria-live="polite"></div>
    <div id="input-area">
      <textarea id="msg-input" placeholder="发送消息…" rows="1" maxlength="2000"></textarea>
      <button id="send-btn" aria-label="发送">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
'use strict';

// ===== State =====
let myNick = '';
let currentChat = 'public'; // 'public' | nick string
let ws = null;
let reconnectTimer = null;
let onlineUsers = [];
// unreadMap: nick -> count
const unreadMap = {};
// privateHistory: nick -> Message[]
const privateHistory = {};
// publicHistory: Message[]
const publicHistory = [];
// publicRendered flag
let publicLoaded = false;

// ===== DOM =====
const nickModal   = document.getElementById('nick-modal');
const nickInput   = document.getElementById('nick-input');
const nickConfirm = document.getElementById('nick-confirm');
const nickErr     = document.getElementById('nick-err');
const myNickBadge = document.getElementById('my-nick-badge');
const sidebar     = document.getElementById('sidebar');
const overlay     = document.getElementById('overlay');
const menuBtn     = document.getElementById('menu-btn');
const publicEntry = document.getElementById('public-entry');
const userList    = document.getElementById('user-list');
const chatTitle   = document.getElementById('chat-title');
const onlineCnt   = document.getElementById('online-count');
const messagesWrap= document.getElementById('messages-wrap');
const msgInput    = document.getElementById('msg-input');
const sendBtn     = document.getElementById('send-btn');
const connBanner  = document.getElementById('conn-banner');
const toast       = document.getElementById('toast');

// ===== Toast =====
let toastTimer = null;
function showToast(msg, duration=2500) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
}

// ===== Sidebar Toggle (mobile) =====
menuBtn.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
});
overlay.addEventListener('click', closeSidebar);
function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}

// ===== Nick Modal =====
nickInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); doSetNick(); }
});
nickConfirm.addEventListener('click', doSetNick);

function doSetNick() {
  const nick = nickInput.value.trim();
  if (!nick || nick.length < 2) {
    nickErr.textContent = '昵称至少2个字符';
    return;
  }
  if (nick.length > 20) {
    nickErr.textContent = '昵称最多20个字符';
    return;
  }
  nickErr.textContent = '';
  myNick = nick;
  myNickBadge.textContent = myNick;
  nickModal.classList.add('hidden');
  localStorage.setItem('chatNick', myNick);
  connectWs();
}

// Restore nick from localStorage
const savedNick = localStorage.getItem('chatNick');
if (savedNick && savedNick.length >= 2) {
  nickInput.value = savedNick;
}

// ===== WebSocket =====
function connectWs() {
  if (ws) { ws.close(); ws = null; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.addEventListener('open', () => {
    connBanner.style.display = 'none';
    clearTimeout(reconnectTimer);
    // Send nick
    send({ type: 'nick', content: myNick });
  });

  ws.addEventListener('message', e => {
    try {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    } catch (_) {}
  });

  ws.addEventListener('close', () => {
    connBanner.style.display = 'block';
    reconnectTimer = setTimeout(connectWs, 4000);
  });

  ws.addEventListener('error', () => {
    ws.close();
  });
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ===== Message Handling =====
function handleMessage(msg) {
  switch (msg.type) {
    case 'online':
      updateOnlineList(msg.content ? msg.content.split(',').filter(Boolean) : []);
      break;

    case 'system':
      // Show system msg in current channel
      appendSystemMsg(msg.content);
      if (msg.content && msg.content.includes('已被占用')) {
        // Nick conflict: show modal again
        myNick = '';
        nickModal.classList.remove('hidden');
        nickErr.textContent = msg.content;
      }
      break;

    case 'public':
      publicHistory.push(msg);
      if (currentChat === 'public') {
        renderPublicMsg(msg, true);
      }
      break;

    case 'private': {
      const peer = (msg.from === myNick) ? msg.to : msg.from;
      if (!privateHistory[peer]) privateHistory[peer] = [];
      privateHistory[peer].push(msg);

      if (currentChat === peer) {
        renderPrivateMsg(msg, peer, true);
      } else {
        // Unread badge
        unreadMap[peer] = (unreadMap[peer] || 0) + 1;
        updateUserListUI();
        showToast(`💬 ${peer}: ${msg.content.slice(0, 30)}`);
      }
      break;
    }
  }
}

// ===== Online Users =====
function updateOnlineList(nicks) {
  onlineUsers = nicks.filter(n => n !== myNick);
  const count = nicks.length;
  onlineCnt.innerHTML = '';
  onlineCnt.textContent = count + ' 人在线';
  updateUserListUI();
}

function updateUserListUI() {
  userList.innerHTML = '';
  if (onlineUsers.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'color:#555;font-size:12px;padding:8px 20px;';
    empty.textContent = '暂无其他用户';
    userList.appendChild(empty);
    return;
  }
  onlineUsers.forEach(nick => {
    const el = document.createElement('div');
    el.className = 'user-item' + (currentChat === nick ? ' active' : '');
    const letter = nick[0].toUpperCase();
    const unread = unreadMap[nick] || 0;
    el.innerHTML = `
      <div class="avatar">${letter}</div>
      <span class="u-name">${esc(nick)}</span>
      ${unread > 0 ? `<span class="u-unread">${unread}</span>` : '<span class="u-dot"></span>'}
    `;
    el.addEventListener('click', () => {
      switchTo(nick);
      closeSidebar();
    });
    userList.appendChild(el);
  });
}

// ===== Switch Channel =====
function switchTo(channel) {
  currentChat = channel;
  // Update sidebar active states
  publicEntry.classList.toggle('active', channel === 'public');
  updateUserListUI();
  // Clear messages panel
  messagesWrap.innerHTML = '';
  if (channel === 'public') {
    chatTitle.textContent = '公开频道';
    // Re-render public history
    publicHistory.forEach(m => renderPublicMsg(m, false));
    scrollBottom();
  } else {
    chatTitle.textContent = `私聊 · ${channel}`;
    unreadMap[channel] = 0;
    updateUserListUI();
    // Re-render private history for this peer
    const hist = privateHistory[channel] || [];
    hist.forEach(m => renderPrivateMsg(m, channel, false));
    scrollBottom();
  }
  msgInput.focus();
}

publicEntry.addEventListener('click', () => {
  switchTo('public');
  closeSidebar();
});

// ===== Render Public Msg =====
function renderPublicMsg(msg, scroll) {
  const isMe = msg.from === myNick;
  const el = buildBubble(msg.from, msg.content, msg.timestamp, isMe);
  messagesWrap.appendChild(el);
  if (scroll) scrollBottom();
}

// ===== Render Private Msg =====
function renderPrivateMsg(msg, peer, scroll) {
  const isMe = msg.from === myNick;
  const el = buildBubble(msg.from, msg.content, msg.timestamp, isMe);
  messagesWrap.appendChild(el);
  if (scroll) scrollBottom();
}

// ===== Build Bubble =====
function buildBubble(from, content, ts, isMe) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (isMe ? ' me' : '');

  const letter = (from || '?')[0].toUpperCase();
  const timeStr = formatTime(ts);

  row.innerHTML = `
    <div class="avatar">${esc(letter)}</div>
    <div class="bubble-wrap">
      ${!isMe ? `<span class="sender">${esc(from)}</span>` : ''}
      <div class="bubble">
        ${esc(content)}
        <span class="ts">${timeStr}</span>
      </div>
    </div>
  `;
  return row;
}

function appendSystemMsg(text) {
  const el = document.createElement('div');
  el.className = 'system-msg';
  el.textContent = text;
  messagesWrap.appendChild(el);
  scrollBottom();
}

// ===== Send Message =====
function doSend() {
  const content = msgInput.value.trim();
  if (!content) return;
  if (!myNick) return;

  if (currentChat === 'public') {
    send({ type: 'public', content });
  } else {
    send({ type: 'private', to: currentChat, content });
  }
  msgInput.value = '';
  autoResize();
  msgInput.focus();
}

sendBtn.addEventListener('click', doSend);
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    doSend();
  }
});

// ===== Auto-resize textarea =====
function autoResize() {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
}
msgInput.addEventListener('input', autoResize);

// ===== Scroll to Bottom =====
function scrollBottom() {
  requestAnimationFrame(() => {
    messagesWrap.scrollTop = messagesWrap.scrollHeight;
  });
}

// ===== Helpers =====
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const pad = n => String(n).padStart(2, '0');
  if (isToday) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ===== iOS: prevent input toolbar from pushing layout =====
// Fix: always keep input area in view when virtual keyboard opens
if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
  msgInput.addEventListener('focus', () => {
    setTimeout(scrollBottom, 350);
  });
  // Prevent window scroll caused by keyboard
  document.body.addEventListener('touchmove', e => {
    if (e.target === document.body) e.preventDefault();
  }, { passive: false });
}

// ===== Init: show nick modal =====
nickModal.classList.remove('hidden');
nickInput.focus();
</script>
