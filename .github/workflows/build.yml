name: Build and Release

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'          # 推送 tag 时自动触发

permissions:
  contents: write

jobs:
  build:
    name: Build Alpine Linux Binary
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - run: go mod tidy

      - name: Build static binary
        run: |
          export CC=musl-gcc
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64
          go build -ldflags='-s -w -linkmode external -extldflags "-static"' -o chatroom .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatroom-binary
          path: |
            chatroom
            deploy-simple.sh
          retention-days: 30

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chatroom
            deploy-simple.sh
