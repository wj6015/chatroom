name: Build and Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib musl-dev

      - name: Build Binary
        run: |
          # 针对 Alpine 系统，我们需要使用静态链接或者确保兼容性
          # CGO_ENABLED=1 是编译 go-sqlite3 的硬性要求
          export CGO_ENABLED=1
          export GOOS=linux
          go mod tidy
          go build -ldflags "-s -w" -o chatroom main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatroom-binary
          path: chatroom
