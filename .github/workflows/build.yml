name: Build and Release

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'          # 推送 tag 时自动触发

permissions:
  contents: write

jobs:
  build:
    name: Build Alpine Linux Binary
    runs-on: ubuntu-latest
    
    container:
      image: golang:1.22-alpine  # 直接使用 Alpine 环境编译
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: apk add gcc musl-dev

      - run: go mod tidy

      - name: Build binary
        run: |
          export CGO_ENABLED=1
          go build -ldflags='-s -w' -o chatroom .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatroom-binary
          path: |
            chatroom
            deploy-simple.sh
          retention-days: 30

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chatroom
            deploy-simple.sh
