name: Build and Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib musl-dev

     - name: Build Binary
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          go mod tidy
          # 关键修改：添加 -ldflags 和 --extldflags "-static"
          go build -ldflags '-linkmode external -extldflags "-static" -s -w' -o chatroom main.go
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatroom-binary
          path: chatroom
